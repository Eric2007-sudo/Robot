# ============================================================
#  车辆检测 —— 参数配置
#
#  改完本文件直接重跑 ./car_detector 即可，不需要重新编译。
#  也可以用命令行临时覆盖，例如 ./car_detector --conf 0.4
# ============================================================

# ---------- 模型 ----------
# ONNX 模型路径
weights_path: "weights/car.onnx"

# 模型输入尺寸。必须和导出 ONNX 时的尺寸一致，写错了检测全不对
input_size: 640

# ---------- 后处理阈值 ----------
# conf_threshold: 置信度阈值，低于此值的候选框直接丢掉
#   调大 -> 只保留很确信的目标，漏检增多
#   调小 -> 检出更多，但误检（把背景当车）也增多
conf_threshold: 0.25

# nms_threshold: NMS 的 IoU 阈值
#   两个同类框重叠超过这个比例时，只保留置信度高的那个
#   调大 -> 抑制变弱，同一辆车可能留下多个框
#   调小 -> 抑制变强，挨得近的两辆车可能被误合成一个
nms_threshold: 0.45

# 单张图最多保留多少个检测结果
max_detections: 20
